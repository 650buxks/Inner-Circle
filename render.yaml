# Render "Blueprint": describes Clique's hosting as code, so the whole setup
# can be recreated with a few clicks. Both services use Render's free plans.
# The database lives on Neon (free Postgres), so DATABASE_URL is pasted in
# by hand when the Blueprint is first set up.

services:
  - type: web
    name: clique
    runtime: docker # built from the Dockerfile; it runs migrations and Daphne
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true # Render makes a long random key
      - key: DATABASE_URL
        sync: false # asked for during setup: paste Neon's connection string
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: clique-redis
          property: connectionString
      # There's no free background worker, so Celery jobs run inside the
      # web app instead (same code, no extra service).
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: CLOUDINARY_URL
        sync: false # asked for during setup: paste Cloudinary's API URL
      - key: ANTHROPIC_API_KEY
        sync: false # asked for during setup: paste your Claude API key
      # Real emails (password reset) through Brevo's SMTP service.
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_HOST_USER
        sync: false # Brevo's SMTP login
      - key: EMAIL_HOST_PASSWORD
        sync: false # Brevo's SMTP key
      - key: DEFAULT_FROM_EMAIL
        sync: false # e.g. Clique <you@example.com>, a sender Brevo verified
  - type: keyvalue # Render's Redis-compatible store, for live messaging
    name: clique-redis
    plan: free
    ipAllowList: [] # only reachable by Clique itself, not the internet