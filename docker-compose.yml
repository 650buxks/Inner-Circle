# Local development: `docker compose up --build` starts all four services.
#   web    - Django at http://localhost:8000 (reloads when you save a file)
#   worker - Celery, runs background jobs
#   db     - PostgreSQL
#   redis  - Redis, for live messaging and the job queue

services:
  web:
    build:
      context: .
      args:
        DEV: "true"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app # your code is shared with the container, so edits show up right away
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      args:
        DEV: "true"
    command: celery -A config worker --loglevel=info
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clique}
      POSTGRES_USER: ${POSTGRES_USER:-clique}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clique}
    volumes:
      - postgres_data:/var/lib/postgresql/data # keeps your data between restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
